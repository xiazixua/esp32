; PlatformIO Project Configuration File
;
; Vela Gateway — Hoshino ESP32 Watch Gateway fork
; Fix profile:
;   - default build uses ESP-IDF + Arduino component so sdkconfig.defaults
;     actually recompiles BT/Wi-Fi/lwIP with the low-memory settings.
;   - keeps huge_app.csv because this OLED fork's firmware is ~2.0MB.
;   - source adds Wi-Fi retry + STA default-route/NAPT repair after bootstrap.

[platformio]
default_envs = upesy_wroom_lowmem_idf

[env]
platform = espressif32
monitor_speed = 2000000
lib_deps =
  bblanchon/ArduinoJson @ ^7.4.2
  sh123/esp32_opus
  olikraus/U8g2 @ ^2.36.12

; Recommended for the uploaded uPesy WROOM board (4MB Flash, no PSRAM).
[env:upesy_wroom_lowmem_idf]
board = upesy_wroom
framework = espidf, arduino
board_build.partitions = huge_app.csv
lib_ignore = AsyncUDP
build_flags =
  -Wno-error
  -Wno-error=maybe-uninitialized
  -Wno-error=unused-variable
  -Wno-error=unused-function
  -Wno-maybe-uninitialized
  -DIP_NAPT_MAX=16
  -DIP_PORTMAP_MAX=1
  -DHOSHINO_LOW_MEMORY_SDKCONFIG=1

; Pure-Arduino fallback. It can build the fork, but the precompiled IDF/Wi-Fi
; libraries cannot consume sdkconfig.defaults, so it is NOT recommended on a
; memory-tight WROOM when Classic BT + Wi-Fi + NAPT are all active.
[env:upesy_wroom_arduino]
board = upesy_wroom
framework = arduino
board_build.partitions = huge_app.csv
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_LWIP_IP_FORWARD=1
  -DCONFIG_LWIP_IPV4_NAPT=1
  -DCONFIG_LWIP_L2_TO_L3_COPY=1
  -DIP_NAPT_MAX=16
  -DIP_PORTMAP_MAX=1
  -DCONFIG_ARDUINO_LOOP_TASK_STACK_SIZE=4096

[env:esp32-wrover]
board = esp-wrover-kit
framework = arduino
board_build.partitions = huge_app.csv
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_LWIP_IP_FORWARD=1
  -DCONFIG_LWIP_IPV4_NAPT=1
  -DCONFIG_LWIP_L2_TO_L3_COPY=1
  -DIP_NAPT_MAX=16
  -DIP_PORTMAP_MAX=1
  -DCONFIG_ARDUINO_LOOP_TASK_STACK_SIZE=4096
